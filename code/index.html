<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/code/style.css">
</head>
<body>
    <header>
        <section class="header__left--buttons">
            <img src="/img/burger.svg" class="header__left--buttons--burger" alt="img-burger">
            <img src="/img/Group.svg" class="header__left--buttons--group" alt="img-group">
        </section>
        <section class="header__right--buttons">
            <img src="/img/search.svg" class="header__right--buttons--search" alt="search">
        </section>
    </header>

    <main>
        <section class="type__top">
            <div class="type__top--line"></div>
            <div class="type__top--text">Ремонт техники</div>
        </section>

        <section class="type__class">
            <div class="type__class--first">Услуги и сервисы</div>
            <div class="type__class--second">Корпоративным клиентам</div>
            <div class="type__class--third">Продавец техники</div>
            <div class="type__class--fourth">Партнёрам</div>
            <div class="type__class--fifth">Производителям</div>
            <div class="type__class--sixth">Наши сервисные центры</div>
            <div class="type__class--seventh">Контакты</div>
        </section>
    </main>

    <footer>
        <section class="footer__buttons">
            <img src="/img/call.svg" class="footer__buttons--call" alt="img-call">
            <img src="/img/chat.svg" class="footer__buttons--chat" alt="img-chat">
            <img src="/img/profile.svg" class="footer__buttons--profile" alt="img-profile">
        </section>

        <section class="footer__info">
            <div class="footer__info--mail">mail@cps.com</div>
            <div class="footer__info--phone">8 800 890 8900</div>
        </section>

        
        <section class="footer__language--select">
            <input type="radio" id="footer__language--select--ru" name="language" checked hidden>
            <label for="footer__language--select--ru" class="footer__language">RU</label>

            <input type="radio" id="footer__language--select--en" name="language" hidden>
            <label for="footer__language--select--en" class="footer__language">EN</label>

            <input type="radio" id="footer__language--select--ch" name="language" hidden>
            <label for="footer__language--select--ch" class="footer__language">CH</label>
        </section>
    </footer>
</body>
</html>
